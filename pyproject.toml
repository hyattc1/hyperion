[project]
name = "snapcall"
version = "0.1.0"
description = "A millisecond poker bot and training ground for Sequoia's No Limit bot-building tournament"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-benchmark>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapcall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
