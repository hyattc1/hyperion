[project]
name = "hyperion"
version = "0.1.0"
description = "Millisecond-budget poker engine, bot sandbox and strategy tables in pure Python"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-benchmark>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyperion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "timing: wall-clock budget and latency tests that fail on a loaded host (the night runs pytest -m \"not timing\"; the default runs everything)",
    "night: the one-minute subset for the night on a loaded box (`pytest -m night`: the adapter, conformance, pack, ship switch and template tests); the full suite is for the day",
]
